<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aphex Twin 24/7 Radio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Слайд-шоу -->
        <div class="slideshow">
            <img id="slideImage" src="" alt="Slideshow" class="slide-image" onerror="this.style.display='none'">
            <div class="slideshow-placeholder" id="slidePlaceholder">
                <div class="placeholder-text">Album Art</div>
            </div>
        </div>

        <!-- Плеер -->
        <div class="player">
            <div class="track-info">
                <div class="track-title" id="trackTitle">Загрузка...</div>
                <div class="track-album" id="trackAlbum">Aphex Twin</div>
            </div>

            <div class="vinyl-container">
                <div class="vinyl" id="vinyl">
                    <img src="Photo/AFXX.png" alt="Vinyl" class="vinyl-image">
                    <div class="vinyl-inner"></div>
                </div>
            </div>

            <div class="time-display">
                <span class="time" id="currentTime">0:00</span>
                <span class="time-separator">/</span>
                <span class="time" id="duration">0:00</span>
            </div>

            <button id="playBtn" class="play-button">▶ Запустить радио</button>

            <div class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
            </div>

            <a href="https://t.me/afxgit" target="_blank" class="telegram-btn">
                <span class="telegram-icon">✈️</span>
                <span class="telegram-text">Telegram канал</span>
            </a>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
